<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123b4a">
  <title>Tabbara Fish - POS</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h1>🐟 Tabbara Fish</h1>
      <p>تسجيل الدخول إلى النظام</p>
      <input id="loginPassword" type="password" placeholder="كلمة السر"
             onkeydown="if(event.key==='Enter') login()">
      <button onclick="login()">🔓 دخول</button>
      <p id="loginError" class="login-error">كلمة السر غير صحيحة</p>
    </div>
  </div>

  <div class="app">
    <header>
      <h1>🐟 Tabbara Fish</h1>
      <p>Restaurant POS</p>
      <div class="header-buttons">
        <span id="connectionStatus" class="status-badge">...</span>
        <button class="orders-button" onclick="showOrders()">📋 الطلبات السابقة</button>
        <button class="orders-button" onclick="showMenuManager()">⚙️ إدارة المنيو</button>
        <button class="orders-button" onclick="logout()">🔒 خروج</button>
      </div>
    </header>

    <main>
      <section class="menu">
        <h2>🍽️ قائمة الطعام</h2>

        <div class="order-type">
          <button onclick="setOrderType('Delivery')" id="deliveryBtn">🛵 Delivery</button>
          <button onclick="setOrderType('استلام من المحل')" id="pickupBtn">🏪 استلام من المحل</button>
        </div>

        <div id="categories" class="categories"></div>
        <div id="items" class="items"></div>
      </section>

      <section class="cart">
        <h2>🛒 الطلب الحالي</h2>
        <div class="order-info"><strong>نوع الطلب:</strong> <span id="orderType">لم يتم الاختيار</span></div>
        <div id="cartItems"><p>لا يوجد أصناف</p></div>
        <div class="total">المجموع: $<span id="total">0.00</span></div>
        <hr>

        <h3>👤 بيانات الزبون</h3>
        <input id="name" type="text" placeholder="اسم الزبون">
        <input id="phone" type="tel" placeholder="رقم الهاتف">
        <input id="address" type="text" placeholder="العنوان">
        <textarea id="notes" placeholder="ملاحظات على الطلب"></textarea>
        <div id="customerMessage" class="customer-message"></div>

        <button class="clear" onclick="clearOrder()">🗑️ مسح الطلب</button>
        <button class="confirm" onclick="confirmOrder()">✅ تأكيد الطلب</button>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script src="script.js?v=10"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</body>
</html>
