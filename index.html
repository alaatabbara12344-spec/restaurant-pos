<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Al Bahar Restaurant</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <div class="app">

    <header>

      <h1>🐟 مطعم البحر</h1>

      <p>Fish & Seafood POS</p>

    </header>


    <main>

      <!-- MENU -->

      <section class="menu">

        <h2>قائمة الطعام</h2>


        <div class="categories">

          <button onclick="showCategory('مقبلات')">
            🥗 مقبلات
          </button>

          <button onclick="showCategory('أسماك')">
            🐟 أسماك
          </button>

          <button onclick="showCategory('مشاوي')">
            🔥 مشاوي
          </button>

          <button onclick="showCategory('مقالي')">
            🍤 مقالي
          </button>

          <button onclick="showCategory('سلطات')">
            🥬 سلطات
          </button>

          <button onclick="showCategory('مشروبات')">
            🥤 مشروبات
          </button>

        </div>


        <div id="items" class="items"></div>

      </section>



      <!-- ORDER -->

      <section class="cart">

        <h2>🛒 الطلب الحالي</h2>


        <div id="cartItems">

          <p>لا يوجد أصناف</p>

        </div>


        <div class="total">

          المجموع:
          $<span id="total">0</span>

        </div>


        <hr>


        <h3>بيانات الزبون</h3>


        <input
          id="name"
          type="text"
          placeholder="اسم الزبون">


        <input
          id="phone"
          type="tel"
          placeholder="رقم الهاتف">


        <input
          id="address"
          type="text"
          placeholder="العنوان">


        <textarea
          id="notes"
          placeholder="ملاحظات على الطلب">
        </textarea>


        <button
          class="confirm"
          onclick="confirmOrder()">

          ✅ تأكيد الطلب

        </button>

      </section>

    </main>

  </div>


  <!-- JAVASCRIPT -->

  <script src="script.js"></script>

</body>

</html>
